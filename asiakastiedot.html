<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEHKU – Asiakastiedot</title><style>*,*:before,*:after{box-sizing:border-box}body{margin:0;background:#210818;color:#f8e4ec;font:16px/1.65 system-ui,Arial,sans-serif}a{color:#edc98a}header{background:#291329;border-bottom:1px solid #edc98a55;padding:18px max(20px,calc((100vw - 1080px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{font-size:27px;font-weight:800;letter-spacing:.14em;text-decoration:none;color:#edc98a}.langs{display:flex;gap:7px}.langs button{background:#482044;color:#f8e4ec;border:1px solid #edc98a66;border-radius:7px;padding:8px 12px;cursor:pointer}.langs button[aria-pressed=true]{background:#edc98a;color:#210818}main{max-width:1080px;margin:auto;padding:30px 20px 55px}h1{color:#edc98a;line-height:1.2}h2{font-size:1.2rem;color:#edc98a;margin:0 0 8px}.intro{max-width:850px}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;margin-top:25px}nav{display:flex;flex-direction:column;gap:7px;align-self:start}nav a{padding:9px 12px;background:#3b1b3a;border-radius:8px;text-decoration:none}nav a.active{background:#edc98a;color:#210818}.panel{background:#3b152b;border:1px solid #edc98a44;border-radius:14px;padding:25px;min-height:180px}footer{text-align:center;padding:25px 15px;background:#291329;border-top:1px solid #edc98a44;font-size:.85rem}@media(max-width:650px){.layout{grid-template-columns:1fr}nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}nav a{font-size:.9rem}.panel{padding:18px}}</style></head><body><header><a class="brand" href="index.html">HEHKU ✦</a><div class="langs"><button data-lang="fi">FI</button><button data-lang="sv">SV</button><button data-lang="en">EN</button></div></header><main><h1 id="heading"></h1><p class="intro" id="intro"></p><div class="layout"><nav id="nav" aria-label="Information"></nav><article class="panel"><h2 id="section-heading"></h2><p id="section-body"></p></article></div></main><footer>© 2026 HEHKU · Demo / Testiversio / Testversion · <a href="index.html">HEHKU</a></footer><script>const content={"fi":{"title":"HEHKU – Asiakastiedot","intro":"HEHKU on kehitteillä oleva testiverkkokauppa. Sivustolla ei voi tehdä oikeita tilauksia eikä maksuja. Alla olevat tiedot ovat valmisteluvaiheen luonnoksia, eivät voimassa olevia myyntiehtoja.","nav":["Toimitusehdot","Maksutavat","Palautukset ja reklamaatiot","Tietosuojaseloste","Evästekäytäntö","Yhteystiedot","Usein kysytyt kysymykset","Tietoa HEHKUsta"],"sections":[["Toimitusehdot","HEHKU ei vielä myy tuotteita. Tuotevalikoima, hinnat ja toimitusvaihtoehdot ovat esimerkkejä. Ennen myynnin aloittamista julkaistaan yrityksen yksilöintitiedot, tilaus- ja toimitusehdot, toimitusalueet, toimitusajat sekä kulut."],["Maksutavat","Testikassa näyttää vain esimerkkilaskelman. Maksuja ei veloiteta. Todelliset maksutavat ja maksupalveluntarjoaja ilmoitetaan ennen myynnin aloittamista."],["Palautukset ja reklamaatiot","Ennen oikean myynnin aloittamista kerromme lakisääteisestä peruuttamisoikeudesta, palautusohjeista, kustannuksista ja virhevastuusta. Etämyynnissä on pääsääntöisesti 14 päivän peruuttamisoikeus. Lain mukaisia poikkeuksia voi koskea esimerkiksi sinetöityjä hygieniatuotteita, joiden sinetti on avattu toimituksen jälkeen. Tuotekohtaiset ehdot tarkistetaan ennen julkaisua."],["Tietosuojaseloste","Tämä on alustava tietosuojatiedote. Testikauppa ei ota vastaan oikeita tilauksia tai maksutietoja. Sivusto voi tallentaa selaimeesi esimerkiksi testikorin sisällön ja kielivalinnan. Ennen julkaisua selvitetään mahdolliset muut henkilötietojen käsittelyt, rekisterinpitäjän tiedot, käsittelyn perusteet, säilytysajat ja rekisteröidyn oikeudet. Älä syötä testikauppaan arkaluonteisia tietoja."],["Evästekäytäntö","Sivusto käyttää selaimen paikallista tallennustilaa muun muassa testikorin ja kielivalinnan säilyttämiseen. Mahdolliset evästeet ja kolmansien osapuolten palvelut kartoitetaan ennen julkaisua. Jos käyttöön otetaan suostumusta edellyttäviä evästeitä, suostumusratkaisu toteutetaan ennen niiden käyttöä."],["Yhteystiedot","HEHKUn projektisähköposti: hehku.business@proton.me. Yrityksen nimi, Y-tunnus, osoite ja muut lakisääteiset yhteystiedot täydennetään, kun ne varmistuvat. Sähköposti on projektin yhteydenottoihin; varsinaista asiakaspalvelua tai tilausten käsittelyä ei ole vielä avattu."],["Usein kysytyt kysymykset","Voinko tilata nyt? Et. Kyseessä on testiversio. Ovatko hinnat ja toimituskulut lopullisia? Eivät, ne ovat esimerkkejä. Milloin kauppa avataan? Ajankohtaa ei ole vielä vahvistettu."],["Tietoa HEHKUsta","HEHKU on kehitteillä oleva intiimihyvinvoinnin verkkokauppahanke. Tavoitteena on selkeä ja luotettava ostokokemus suomeksi, ruotsiksi ja englanniksi."]]},"sv":{"title":"HEHKU – Kundinformation","intro":"HEHKU är en webbutik under utveckling. Inga riktiga beställningar eller betalningar kan göras. Informationen nedan är utkast, inte gällande försäljningsvillkor.","nav":["Leveransvillkor","Betalningssätt","Returer och reklamationer","Dataskydd","Cookiepolicy","Kontaktuppgifter","Vanliga frågor","Om HEHKU"],"sections":[["Leveransvillkor","HEHKU säljer ännu inga produkter. Produkter, priser och leveransalternativ är exempel. Företagsuppgifter, leveransvillkor, områden, tider och kostnader publiceras före lanseringen."],["Betalningssätt","Testkassan visar endast en exempelsammanställning. Inga betalningar debiteras. Betalningssätt och leverantör meddelas före lanseringen."],["Returer och reklamationer","Information om lagstadgad ångerrätt, returer, kostnader och reklamationer publiceras före försäljningsstart. Vid distansköp gäller som huvudregel 14 dagars ångerrätt. Lagstadgade undantag kan bland annat gälla för förseglade hygienprodukter vars försegling brutits efter leverans. Produktvillkoren granskas före lansering."],["Dataskydd","Detta är preliminär dataskyddsinformation. Testbutiken tar inte emot riktiga beställningar eller betalningsuppgifter. Webbläsaren kan spara testvarukorgen och språkvalet lokalt. Personuppgiftsbehandling, personuppgiftsansvarig, rättsliga grunder, lagringstider och rättigheter utreds före lanseringen. Ange inte känsliga uppgifter."],["Cookiepolicy","Webbplatsen använder lokal lagring i webbläsaren bland annat för testvarukorg och språkval. Eventuella cookies och tredjepartstjänster kartläggs före lanseringen. Samtycke införs vid behov innan cookies som kräver samtycke används."],["Kontaktuppgifter","Projektets e-post: hehku.business@proton.me. Företagsnamn, FO-nummer, adress och andra obligatoriska kontaktuppgifter kompletteras när de är fastställda. Kundtjänst för riktiga beställningar är ännu inte öppen."],["Vanliga frågor","Kan jag beställa nu? Nej, detta är en testversion. Är priserna slutliga? Nej, de är exempel. När öppnar butiken? Inget datum har fastställts."],["Om HEHKU","HEHKU är ett e-handelsprojekt inom intimt välbefinnande. Målet är en tydlig och pålitlig köpupplevelse på finska, svenska och engelska."]]},"en":{"title":"HEHKU – Customer information","intro":"HEHKU is an online store under development. No real orders or payments can be made. The information below is draft material, not active terms of sale.","nav":["Delivery terms","Payment methods","Returns and complaints","Privacy notice","Cookie policy","Contact details","Frequently asked questions","About HEHKU"],"sections":[["Delivery terms","HEHKU is not yet selling products. Products, prices and delivery options are examples. Company details, ordering terms, delivery areas, times and costs will be published before sales begin."],["Payment methods","The demo checkout displays an example total only. No payments are charged. Actual payment methods and payment provider will be confirmed before launch."],["Returns and complaints","Information about statutory withdrawal rights, returns, costs and remedies for faulty products will be published before sales begin. Distance purchases generally carry a 14-day withdrawal right. Legal exceptions may apply, for example, to sealed hygiene products unsealed after delivery. Product-specific terms will be checked before launch."],["Privacy notice","This is a preliminary privacy notice. The demo store does not accept real orders or payment details. Your browser may store the demo cart and language selection locally. Other personal-data processing, controller details, legal bases, retention periods and data-subject rights will be assessed before launch. Do not enter sensitive information."],["Cookie policy","The website uses browser local storage for functions including the demo cart and language selection. Cookies and third-party services will be assessed before launch. Consent controls will be added before any cookies requiring consent are used."],["Contact details","Project email: hehku.business@proton.me. Legal company name, business ID, address and other required contact details will be added when confirmed. Customer service for real orders is not yet operating."],["Frequently asked questions","Can I order now? No, this is a demo. Are prices final? No, they are examples. When will the shop open? No launch date has been confirmed."],["About HEHKU","HEHKU is an intimate-wellness e-commerce project aiming for a clear, trustworthy shopping experience in Finnish, Swedish and English."]]}};const ids=["delivery","payment","returns","privacy","cookies","contact","faq","about"];let lang;try{lang=localStorage.getItem("hehku_language")||"fi"}catch(e){lang="fi"}if(!content[lang])lang="fi";const params=new URLSearchParams(location.search);let section=ids.indexOf(params.get("s"));if(section<0)section=0;function render(){const d=content[lang];document.documentElement.lang=lang;document.title=d.title;document.getElementById("heading").textContent=d.title;document.getElementById("intro").textContent=d.intro;const nav=document.getElementById("nav");nav.replaceChildren();d.nav.forEach((label,i)=>{const a=document.createElement("a");a.href="?s="+ids[i];a.textContent=label;if(i===section)a.className="active";a.addEventListener("click",e=>{e.preventDefault();section=i;history.pushState(null,"",a.href);render()});nav.append(a)});document.getElementById("section-heading").textContent=d.sections[section][0];document.getElementById("section-body").textContent=d.sections[section][1];document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)))}document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;try{localStorage.setItem("hehku_language",lang)}catch(e){}render()}));addEventListener("popstate",()=>{const i=ids.indexOf(new URLSearchParams(location.search).get("s"));section=i<0?0:i;render()});render();</script></body></html>
